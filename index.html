    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المحرر الذكي | Gemini AI Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 2rem 1rem; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 680px; }
        .card { background: #1e293b; padding: 2rem; border-radius: 12px; border: 1px solid #334155; margin-bottom: 1.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        h2 { color: #38bdf8; margin-bottom: 1.2rem; text-align: center; font-size: 1.5rem; }
        label { font-size: 0.9rem; color: #94a3b8; display: block; margin-top: 1rem; margin-bottom: 0.4rem; }
        input, textarea, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; outline: none; font-family: inherit; }
        input:focus, textarea:focus, select:focus { border-color: #38bdf8; }
        button { width: 100%; margin-top: 1.2rem; padding: 12px; border-radius: 8px; border: none; background: #0284c7; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0369a1; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .result-box { margin-top: 1.5rem; background: #0f172a; padding: 1rem; border-radius: 8px; border: 1px solid #334155; white-space: pre-wrap; line-height: 1.6; display: none; }
        
        .pricing-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
        @media (max-width: 500px) { .pricing-grid { grid-template-columns: 1fr; } }
        .plan-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 1.2rem; text-align: center; }
        .plan-card h3 { color: #38bdf8; font-size: 1.1rem; }
        .price { font-size: 1.4rem; font-weight: bold; color: #4ade80; margin: 0.5rem 0; }
        .btn-pay { background: #16a34a; margin-top: 0.8rem; }
        .btn-pay:hover { background: #15803d; }
    </style>
</head>
<body>
    <div class="container">
        <!-- قسم توليد المحتوى بالذكاء الاصطناعي -->
        <div class="card">
            <h2>🚀 منصة المحرر الذكي (Gemini AI)</h2>
            
            <label>مفتاح Gemini API الخاص بك:</label>
            <input type="text" id="geminiKey" placeholder="ألصق مفتاح AIzaSy... هنا">
            
            <label>نوع الخدمة المطلوبة:</label>
            <select id="taskType">
                <option value="content">كتابة مقال أو محتوى إبداعي</option>
                <option value="ad">كتابة إعلان تسويقي موجه</option>
                <option value="summary">تلخيص وتحسين نص</option>
            </select>

            <label>اكتب الطلب أو الفكرة بالتفصيل:</label>
            <textarea id="prompt" rows="5" placeholder="مثال: اكتب لي إعلاناً جذاباً لمنتج قهوة مختصة..."></textarea>
            
            <button id="generateBtn" onclick="generateAIContent()">توليد المحتوى الذكي ✨</button>
            
            <div id="output" class="result-box"></div>
        </div>

        <!-- قسم الشحن والدفع عبر PayPal -->
        <div class="card">
            <h2>💳 تجديد الاشتراكات والنقاط</h2>
            <p style="font-size: 0.85rem; color: #94a3b8; text-align: center;">
                اختر الباقة المناسبة للترقية وشحن النقاط فوراً عبر الدفع الإلكتروني.
            </p>
            
            <div class="pricing-grid">
                <div class="plan-card">
                    <h3>الباقة الأساسية</h3>
                    <p class="price">$10 USD</p>
                    <p style="font-size: 0.8rem; color: #cbd5e1;">100 نقطة استخدام</p>
                    <button class="btn-pay" onclick="payWithPayPal('10.00', 'Basic_Plan')">شراء عبر PayPal 🔒</button>
                </div>
                
                <div class="plan-card">
                    <h3>الباقة الاحترافية</h3>
                    <p class="price">$25 USD</p>
                    <p style="font-size: 0.8rem; color: #cbd5e1;">300 نقطة استخدام</p>
                    <button class="btn-pay" onclick="payWithPayPal('25.00', 'Pro_Plan')">شراء عبر PayPal 🔒</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function generateAIContent() {
            const keyInput = document.getElementById('geminiKey');
            const promptInput = document.getElementById('prompt');
            const generateBtn = document.getElementById('generateBtn');
            const output = document.getElementById('output');

            const apiKey = keyInput.value.trim();
            const prompt = promptInput.value.trim();
            const taskType = document.getElementById('taskType').value;

            if (!apiKey) {
                alert('يرجى إدخال مفتاح Gemini API الخاص بك أولاً');
                keyInput.focus();
                return;
            }

            if (!prompt) {
                alert('يرجى كتابة الطلب أو الفكرة أولاً');
                promptInput.focus();
                return;
            }

            generateBtn.disabled = true;
            generateBtn.innerText = '⏳ جاري الاتصال بخوادم Gemini...';
            output.style.display = 'block';
            output.innerText = '⏳ جاري المعالجة والتوليد...';

            let systemInstruction = "أنت مساعد ذكاء اصطناعي محترف يكتب باللغة العربية الفصحى وبأسلوب جذاب.";
            if (taskType === 'ad') {
                systemInstruction = "أنت خبير تسويق إلكتروني، اكتب إعلاناً جذاباً ومحفزاً على الشراء باستخدام إيموجيز مناسبة.";
            } else if (taskType === 'summary') {
                systemInstruction = "أنت محرر نصوص، قم بتلخيص النص التالي وتنظيمه في نقاط رئيسية واضحة.";
            }

            const fullPrompt = `${systemInstruction}\n\nالطلب: ${prompt}`;

            try {
                // تم تحديث اسم النموذج إلى gemini-3.8-flash الموصى به رسمياً
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: fullPrompt }] }]
                    })
                });

                const data = await response.json();

                if (response.ok && data.candidates && data.candidates[0].content.parts[0].text) {
                    output.innerText = data.candidates[0].content.parts[0].text;
                } else {
                    const errMsg = data.error ? data.error.message : 'تأكد من صحة المفتاح وسرعة الاتصال';
                    output.innerText = '❌ حدث خطأ: ' + errMsg;
                }
            } catch (error) {
                output.innerText = '❌ تعذر الاتصال بالشبكة: ' + error.message;
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerText = 'توليد المحتوى الذكي ✨';
            }
        }

        function payWithPayPal(amount, planName) {
            const p1 = "aalhee34";
            const p2 = "@gmail.com";
            const targetAccount = p1 + p2;
            
            const paypalUrl = `https://www.paypal.com/cgi-bin/webscr?cmd=_xclick&business=${encodeURIComponent(targetAccount)}&item_name=Gemini_AI_${planName}&amount=${amount}&currency_code=USD`;
            window.open(paypalUrl, '_blank');
        }
    </script>
</body>
</html>
